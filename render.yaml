services:
  - type: web
    name: aurum-edge-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Aurum Edge
      - key: DATABASE_URL
        fromDatabase:
          name: aurum-edge-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: PYTHON_VERSION
        value: 3.12.9

  - type: workflow
    name: aurum-edge-workflows
    runtime: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: render-workflows app.workflow:workflow
    envVars:
      - key: APP_NAME
        value: Aurum Edge
      - key: DATABASE_URL
        fromDatabase:
          name: aurum-edge-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.9

  - type: web
    name: aurum-edge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: aurum-edge-db
    databaseName: aurum_edge
    user: aurum_edge
    region: oregon
    plan: free
